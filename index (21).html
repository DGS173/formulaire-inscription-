:root{
  --bg:#EEF3F5; --card:#FFFFFF; --ink:#12202B; --muted:#5B6B77;
  --line:#C9D4DB; --accent:#0F5C5A; --accent-ink:#FFFFFF; --err:#B3261E; --ok:#1B6B3A;
}

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.5;min-height:100vh}
.top{display:flex;justify-content:flex-end;align-items:center;gap:.6rem;
  padding:.8rem 1rem;background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5}

  border-radius:8px;background:var(--bg);color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:1.6rem 1rem 3rem}
h1{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:800;letter-spacing:-.02em;margin:.4rem 0 .4rem}
.lead{color:var(--muted);margin:0 0 1.6rem}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.3rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.full{grid-column:1/-1}

.field label{display:block;font-weight:600;font-size:.92rem;margin-bottom:.3rem}
input,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:.7rem .75rem;min-height:46px}

.msg.err{display:block;background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}

/* ===== Entête KREDITAS ===== */
.brand{margin:0 0 1.4rem;overflow:hidden}
.logo{margin:0;font-weight:800;font-size:clamp(2rem,9vw,3rem);letter-spacing:.16em;color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.45);line-height:1.1}

  text-shadow:0 2px 10px rgba(0,0,0,.5);will-change:transform;
  animation:marqueeLR 26s linear infinite}

  .tagline{animation:none}}

/* ===== Témoignages + page Conditions générales ===== */
.trust{margin:1.6rem 0 2rem;color:#fff}

@keyframes tiIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.trust .dots{display:flex;justify-content:center;gap:.5rem;margin-top:.8rem}

/* ===== Pied de page ===== */
.foot{margin-top:1rem;padding:1.4rem 1rem 2rem;background:rgba(0,0,0,.38);color:#fff;font-size:.92rem}

.tw-toast[hidden]{display:none}
button.chatbtn.open{animation:none}
@keyframes shake{0%,80%,100%{transform:none}82%{transform:rotate(-9deg)}84%{transform:rotate(9deg)}86%{transform:rotate(-7deg)}88%{transform:rotate(7deg)}90%{transform:rotate(-3deg)}92%{transform:none}}
@media (prefers-reduced-motion:reduce){button.chatbtn{animation:none}}
.chat{position:fixed;right:.8rem;bottom:calc(4.2rem + env(safe-area-inset-bottom,0px));z-index:21;width:min(360px,calc(100vw - 2rem));

[hidden]{display:none!important}

.consent{display:flex;gap:.6rem;align-items:flex-start;margin-top:1.1rem;font-size:.9rem}
.consent input{width:auto;min-height:0;margin-top:.25rem;flex:0 0 auto}

/* ===== Animation du logo KREDITAS ===== */
.brand{position:relative}
.brand.kr-on .logo{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.brand.kr-on .logo::after{display:none}
.kr-wrap{position:relative;width:100%}
.kr-stage{display:block;width:100%}

.promo{position:relative;margin:0 0 1.6rem;border-radius:16px;overflow:hidden;background:#071c20;box-shadow:0 10px 30px rgba(0,0,0,.4)}
.promo video{display:block;width:100%;aspect-ratio:1/1;object-fit:cover}
.promo button.snd{position:absolute;right:.7rem;bottom:.7rem;width:auto;margin:0;min-height:0;padding:.45rem .75rem;border-radius:999px;background:rgba(0,0,0,.55);color:#fff;font-size:1.1rem;line-height:1}
.kr-cap{min-height:1.7em;text-align:center;color:#F2C14E;font-weight:800;letter-spacing:.1em;
  text-transform:uppercase;font-size:.95rem;text-shadow:0 2px 10px rgba(0,0,0,.5);transition:opacity .25s}

/* ===== Logo & trois pages ===== */
body[data-page="2"] main,body[data-page="3"] main,body[data-page="4"] main{display:none}
body:not([data-page="3"]) #space{display:none}
body:not([data-page="2"]) #bkSpace{display:none}
body[data-page="3"] #space,body[data-page="2"] #bkSpace{padding-bottom:1rem}
.rlogo{display:block;flex:0 0 auto;width:46px;height:46px;margin-inline-end:auto;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.rlogo svg{display:block;width:100%;height:100%}
.is-err{border-color:var(--err)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--err) 28%,transparent)!important;background:color-mix(in srgb,var(--err) 9%,var(--bg))!important}
label.consent.is-err{color:var(--err);border:1px solid var(--err);border-radius:10px;padding:.6rem;background:color-mix(in srgb,var(--err) 9%,transparent)}
.space button.opt{display:block;width:100%;margin:.7rem 0 .2rem;padding:1rem;font-size:1.05rem}
.space .hint{margin:.2rem 0 .8rem;color:var(--muted,#5b6b6b);font-size:.92rem}
.space h3{margin:.4rem 0 .5rem;font-size:1.05rem}
.foot{padding-bottom:6rem}
button.ctbtn{bottom:calc(3.8rem + env(safe-area-inset-bottom,0px));background:#F2C14E;color:#1d1a0c;z-index:19;animation:shake 4.5s ease-in-out 1.6s infinite,ring 2.4s ease-out infinite}
.space button.hl{animation:hlp 1.2s ease-in-out 3}@keyframes hlp{50%{box-shadow:0 0 0 7px rgba(242,193,78,.75)}}
#ct_mail[readonly]{cursor:not-allowed;opacity:.85}
@keyframes glow{0%,100%{box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 0 0 rgba(242,193,78,.55)}50%{box-shadow:0 6px 20px rgba(0,0,0,.4),0 0 0 10px rgba(242,193,78,0)}}
body[data-page="2"] button.ctbtn,body[data-page="3"] button.ctbtn,body[data-page="4"] button.ctbtn{display:none}
@media (prefers-reduced-motion:reduce){button.ctbtn,button.chatbtn,button.chatbtn.ping,.space button.hl,.bub{animation:none}}

const phTxt = i => (PH[lang]||PH.en).split("|")[i];
const jobTxt = i => (JOBS[lang]||JOBS.en).split("|")[i];
function buildJobs(){
  const cur = $("jobSel").value;
  $("jobSel").innerHTML = `<option value="" disabled selected>${phTxt(1)}</option>` +
    JOBS[lang].split("|").slice(0,22).map((x,i)=>`<option value="${i}">${x}</option>`).join("");
  $("jobSel").value = cur; $("job").placeholder = jobTxt(22); jobToggle();
}
function jobToggle(){ const o = $("jobSel").value==="21"; $("job").hidden=!o; $("job").required=o; if(!o) $("job").value=""; }
function jobValue(){ const v=$("jobSel").value; return v==="21" ? $("job").value.trim() : JOBS.fr.split("|")[+v]; }
function updateCities(reset){
  const list = CITIES[$("pays").value], sel = $("villeSel");
  if(list){
    const cur = reset ? "" : sel.value;
    sel.innerHTML = `<option value="" disabled selected>${phTxt(0)}</option>` +
      list.split(",").sort((a,b)=>a.localeCompare(b,lang)).map(x=>`<option>${x}</option>`).join("") +
      `<option value="__other">${jobTxt(21)}</option>`;
    sel.value = cur; sel.hidden=false; sel.required=true;
  } else { sel.innerHTML=""; sel.hidden=true; sel.required=false; }
  cityToggle();
}
function cityToggle(){
  const t = !CITIES[$("pays").value] || $("villeSel").value==="__other";
  $("ville").hidden=!t; $("ville").required=t; if(!t) $("ville").value=""; $("ville").placeholder=jobTxt(23);
}
function cityValue(){ return (!CITIES[$("pays").value] || $("villeSel").value==="__other") ? $("ville").value.trim() : $("villeSel").value; }
$("jobSel").addEventListener("change",jobToggle);
$("villeSel").addEventListener("change",cityToggle);
$("pays").addEventListener("change",()=>updateCities(true));

/* ---- Envoi fiable : délai max, 2 essais, copie de secours si le réseau coupe ---- */
async function postOnce(payload){
  const c=new AbortController(), to=setTimeout(()=>c.abort(),35000);
  try{
    const r=await fetch("https://formsubmit.co/ajax/"+DESTINATION_EMAIL,{method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},body:JSON.stringify(payload),signal:c.signal});
    let d={}; try{ d=await r.json(); }catch(e){}
    return r.ok && (d.success===true||d.success==="true");
  } finally { clearTimeout(to); }
}
async function sendReliable(payload){
  for(let i=0;i<2;i++){
    try{ if(await postOnce(payload)) return true; }catch(e){}
    if(i===0) await new Promise(r=>setTimeout(r,1200));
  }
  return false;
}
function outboxGet(){ try{ return JSON.parse(localStorage.getItem("outbox")||"[]"); }catch(e){ return []; } }
function outboxSet(a){ try{ localStorage.setItem("outbox",JSON.stringify(a)); }catch(e){} }
async function flushOutbox(){
  const a=outboxGet(); if(!a.length) return;
  const rest=[]; for(const p of a){ if(!(await sendRequest(p))) rest.push(p); }
  outboxSet(rest);
}
window.addEventListener("online",flushOutbox);
setTimeout(flushOutbox,3000);

fr:"Mon contrat|Mon contrat de prêt|Votre demande est enregistrée. Votre contrat est prêt : il est rempli avec vos informations, votre montant, votre durée et le calcul de vos mensualités. Choisissez sa langue, téléchargez-le, imprimez-le, signez-le (mention « Lu et approuvé »), puis renvoyez-le ci-dessous.|Langue du contrat|Télécharger le contrat (PDF)|Télécharger en Word|Envoyer mon contrat signé|Photo ou scan du contrat signé, toutes les pages (PDF, JPG ou PNG, 5 fichiers maximum).|Choisir le(s) fichier(s)|Envoyer le contrat signé|Envoi en cours…|Merci ! Votre contrat signé a bien été reçu. Nous vous répondrons très bientôt.|L’envoi a échoué. Vérifiez votre connexion et réessayez.|Votre numéro de référence :|Aucun fichier choisi.|Fichier trop lourd (4 Mo maximum pour un PDF).|fichier(s) choisi(s)|Autorisez les fenêtres pop-up pour afficher le contrat.|Ouvrir le PDF|Retirer",
en:"My contract|My loan contract|Your request has been recorded. Your contract is ready: it is filled in with your details, your amount, your term and your monthly payment calculation. Choose its language, download it, print it, sign it (write “Read and approved”), then send it back below.|Contract language|Download the contract (PDF)|Download as Word|Send my signed contract|Photo or scan of the signed contract, all pages (PDF, JPG or PNG, 5 files maximum).|Choose file(s)|Send the signed contract|Sending…|Thank you! Your signed contract has been received. We will get back to you very soon.|Sending failed. Check your connection and try again.|Your reference number:|No file chosen.|File too large (4 MB maximum for a PDF).|file(s) chosen|Please allow pop-ups to display the contract.|Open the PDF|Remove",
es:"Mi contrato|Mi contrato de préstamo|Su solicitud ha sido registrada. Su contrato está listo: incluye sus datos, su importe, su plazo y el cálculo de sus cuotas mensuales. Elija el idioma, descárguelo, imprímalo, fírmelo (escriba «Leído y aprobado») y envíelo de nuevo más abajo.|Idioma del contrato|Descargar el contrato (PDF)|Descargar en Word|Enviar mi contrato firmado|Foto o escaneo del contrato firmado, todas las páginas (PDF, JPG o PNG, máximo 5 archivos).|Elegir archivo(s)|Enviar el contrato firmado|Enviando…|¡Gracias! Hemos recibido su contrato firmado. Le responderemos muy pronto.|El envío ha fallado. Compruebe su conexión e inténtelo de nuevo.|Su número de referencia:|Ningún archivo elegido.|Archivo demasiado grande (máximo 4 MB para un PDF).|archivo(s) elegido(s)|Permita las ventanas emergentes para mostrar el contrato.|Abrir el PDF|Quitar",
lt:"Mano sutartis|Mano paskolos sutartis|Jūsų paraiška užregistruota. Sutartis paruošta: joje nurodyti jūsų duomenys, suma, trukmė ir mėnesinių įmokų skaičiavimas. Pasirinkite kalbą, atsisiųskite, atspausdinkite, pasirašykite (įrašykite „Perskaičiau ir sutinku“) ir atsiųskite žemiau.|Sutarties kalba|Atsisiųsti sutartį (PDF)|Atsisiųsti Word formatu|Siųsti pasirašytą sutartį|Pasirašytos sutarties nuotrauka arba skenuotė, visi puslapiai (PDF, JPG arba PNG, daugiausia 5 failai).|Pasirinkti failą(-us)|Siųsti pasirašytą sutartį|Siunčiama…|Ačiū! Gavome jūsų pasirašytą sutartį. Netrukus su jumis susisieksime.|Nepavyko išsiųsti. Patikrinkite ryšį ir bandykite dar kartą.|Jūsų nuorodos numeris:|Failas nepasirinktas.|Failas per didelis (PDF – daugiausia 4 MB).|failų pasirinkta|Leiskite iššokančius langus, kad būtų rodoma sutartis.|Atidaryti PDF|Pašalinti",
de:"Mein Vertrag|Mein Darlehensvertrag|Ihr Antrag wurde registriert. Ihr Vertrag ist bereit: Er enthält Ihre Daten, Ihren Betrag, Ihre Laufzeit und die Berechnung Ihrer Monatsraten. Wählen Sie die Sprache, laden Sie ihn herunter, drucken Sie ihn aus, unterschreiben Sie ihn (mit dem Vermerk „Gelesen und genehmigt“) und senden Sie ihn unten zurück.|Sprache des Vertrags|Vertrag herunterladen (PDF)|-|Unterschriebenen Vertrag senden|Foto oder Scan des unterschriebenen Vertrags, alle Seiten (PDF, JPG oder PNG, maximal 5 Dateien).|Datei(en) auswählen|Unterschriebenen Vertrag senden|Wird gesendet…|Danke! Ihr unterschriebener Vertrag ist eingegangen. Wir melden uns in Kürze bei Ihnen.|Senden fehlgeschlagen. Prüfen Sie Ihre Verbindung und versuchen Sie es erneut.|Ihre Referenznummer:|Keine Datei ausgewählt.|Datei zu groß (maximal 4 MB für ein PDF).|Datei(en) ausgewählt|Bitte erlauben Sie Pop-ups, um den Vertrag anzuzeigen.|PDF öffnen|Entfernen",
it:"Il mio contratto|Il mio contratto di prestito|La tua richiesta è stata registrata. Il contratto è pronto: contiene i tuoi dati, l’importo, la durata e il calcolo delle rate mensili. Scegli la lingua, scaricalo, stampalo, firmalo (scrivi «Letto e approvato») e invialo di nuovo qui sotto.|Lingua del contratto|Scarica il contratto (PDF)|-|Invia il mio contratto firmato|Foto o scansione del contratto firmato, tutte le pagine (PDF, JPG o PNG, massimo 5 file).|Scegli file|Invia il contratto firmato|Invio in corso…|Grazie! Abbiamo ricevuto il tuo contratto firmato. Ti risponderemo molto presto.|Invio non riuscito. Controlla la connessione e riprova.|Il tuo numero di riferimento:|Nessun file scelto.|File troppo grande (massimo 4 MB per un PDF).|file scelti|Consenti i pop-up per mostrare il contratto.|Apri il PDF|Rimuovi",

const bkLocal=iban=>{ const v=BKDB[iban.slice(0,2)+iban.slice(4,9)]; return v?{n:v[0],b:v[1]}:null; };
async function bkName(iban){
  if(bkCache[iban]) return bkCache[iban];
  let v=bkLocal(iban);
  if(!v){
    for(let t=0;t<2&&!v;t++){            /* service en ligne en secours (2 essais) ; un échec n’est jamais mémorisé */
      try{
        const c=new AbortController(), tm=setTimeout(()=>c.abort(),7000);
        const r=await fetch("https://openiban.com/validate/"+iban+"?getBIC=true",{signal:c.signal});
        clearTimeout(tm);
        const j=await r.json();
        if(j&&j.bankData&&(j.bankData.name||j.bankData.bic)) v={n:String(j.bankData.name||""),b:String(j.bankData.bic||"")};
      }catch(e){}
    }
  }
  if(v) bkCache[iban]=v;
  return v;
}
function bkIban(){
  const o=$("bk_ibanS"); o.className="vs"; o.innerHTML="";
  if($("bk_no").checked){
    const s=ibClean($("bk_iban").value).replace(/\?/g,""); if(!s) return false;
    const ok=/^[A-Z0-9]{6,34}$/.test(s); o.className="vs "+(ok?"ok":"bad"); o.textContent=ok?"✔":bu(21); return ok;
  }
  const r=ibCheck($("bk_iban").value);
  if(r.st==="empty") return false;
  if(r.st==="ok"){ o.className="vs ok"; o.textContent="✔ "+bu(12)+" — "+ibFmt(r.s)+(r.auto?" ("+bu(23)+")":""); if(r.auto) $("bk_iban").value=ibFmt(r.s);
    const cur=r.s;
    bkName(cur).then(v=>{ if(!v||ibClean($("bk_iban").value)!==cur) return;
      o.textContent="✔ "+bu(12)+" — "+ibFmt(cur)+(v.n?" — "+(BKL[lang]||"Bank")+" : "+v.n:"");
      const bi=$("bk_bic"); if(v.b&&(!bi.value.trim()||bi.dataset.auto==="1")){ bi.value=v.b; bi.dataset.auto="1"; bkBic(); } });
    return true; }
  o.className="vs bad";
  if(r.st==="country") o.textContent=bu(16);
  else if(r.st==="len") o.textContent=bu(14).replace("{n}",r.n).replace("{c}",r.c);
  else { o.textContent=bu(13); if(r.sug&&r.sug.length){ const d=document.createElement("div"); d.textContent=bu(15)+" "; r.sug.forEach(t=>{ const b=document.createElement("button"); b.type="button"; b.dataset.fix=t; b.textContent=ibFmt(t)+" · "+bu(20); d.appendChild(b); }); o.appendChild(d); } }
  return false;
}
function bkBic(){
  const o=$("bk_bicS"); o.className="vs"; o.textContent="";
  const b=ibClean($("bk_bic").value).replace(/\?/g,""); if(!b) return true;   /* BIC facultatif */
  if(!/^[A-Z]{4}[A-Z]{2}[A-Z0-9]{2}([A-Z0-9]{3})?$/.test(b)){ o.className="vs bad"; o.textContent=bu(18); return false; }
  o.className="vs ok"; o.textContent="✔ "+bu(17);
  const ib=ibCheck($("bk_iban").value);
  if(!$("bk_no").checked&&ib.st==="ok"&&b.slice(4,6)!==ib.s.slice(0,2)){ o.className="vs bad"; o.textContent=bu(19); }
  return true;
}

$("bk_send").addEventListener("click",async()=>{
  const r=ctRec(), o=$("bk_out"), b=$("bk_send"), name=$("bk_name").value.trim();

  }catch(err){ o.className="msg err"; o.textContent=bu(11)+((err&&err.message&&err.message!=="send")?" ["+err.message+"]":""); }
  finally{ b.disabled=false; b.textContent=bu(8); }
});

async function sendRequest(payload){
  /* Les deux canaux partent en même temps ; on laisse au script Google quelques secondes pour enregistrer la demande (espace client) */
  const sp = SCRIPT_URL ? (async()=>{
    for(let i=0;i<2;i++){
      try{ const r=await api({action:"demande",ref:payload["Référence"],data:payload}); if(r&&r.ok) return true; }catch(e){}
      if(i===0) await new Promise(r=>setTimeout(r,1000));
    }
    return false;
  })() : Promise.resolve(false);
  const fp = sendReliable(payload);
  const ok = await Promise.any([sp.then(v=>v?true:Promise.reject()), fp.then(v=>v?true:Promise.reject())]).catch(()=>false);
  if(ok && SCRIPT_URL) await Promise.race([sp, new Promise(r=>setTimeout(r,15000))]);
  return ok;
}

function renderLoans(){
  const a=(LOANS[lang]||LOANS.en).split("|"), t=T[lang];
  const nf=v=>{try{return new Intl.NumberFormat(lang,{style:"currency",currency:$("devise").value,maximumFractionDigits:0}).format(v);}catch(e){return v+" "+$("devise").value;}};
  $("loansTitle").textContent=a[0];
  $("cards").innerHTML=LOANIMG.map((x,i)=>
    `<article class="card"><div class="ph" role="img" aria-label="${a[2+i*2]}" style="background-image:${x[2]};background-position:${x[3]}"></div>`+
    `<div class="cb"><h3>${a[2+i*2]}</h3><p>${a[3+i*2]}</p>`+
    `<ul><li>${t.taux}</li><li>${nf(1000)} – ${nf(800000)}</li><li>1 – 35 ${t.mois}</li></ul>`+
    `<a class="cta" href="#form">${a[1]}</a></div></article>`).join("");
}

const flag = iso => String.fromCodePoint(...[...iso].map(ch=>127397+ch.charCodeAt(0)));
function $(id){ return document.getElementById(id); }
let lang = "fr";

function countryName(iso){
  try{ return new Intl.DisplayNames([lang],{type:"region"}).of(iso) || iso; }
  catch(e){ return iso; }
}
function buildLists(){
  const p = $("pays").value || "FR", d = $("indicatif").value || "FR";
  const sorted = COUNTRIES.map(c=>({...c,name:countryName(c.iso)}))
    .sort((a,b)=>a.name.localeCompare(b.name,lang));
  $("pays").innerHTML = `<option value="" disabled>${T[lang].choose}</option>` +
    sorted.map(c=>`<option value="${c.iso}">${flag(c.iso)} ${c.name}</option>`).join("");
  $("indicatif").innerHTML = sorted.map(c=>
    `<option value="${c.iso}" data-dial="${c.dial}">${flag(c.iso)} +${c.dial} ${c.name}</option>`).join("");

let tiIdx=0, tiTimer=null;
function tiShow(i){

function tiAuto(){

function loan(){

  const y = +$("duree").value, n = y*12, r = RATE/12;
  const m = v*r/(1-Math.pow(1+r,-n)), total = m*n;
  return {P:v, y, n, m, total, int: total-v};
}

}

/* ===== E-mail du formulaire : fautes de frappe + e-mail professionnel pour le prêt professionnel ===== */
let proLoan=false, loanKind="";
const EMFIX={"gmail.coom":"gmail.com","gmail.comm":"gmail.com","gmail.con":"gmail.com","gmail.cm":"gmail.com","gmail.co":"gmail.com","gmial.com":"gmail.com","gamil.com":"gmail.com","gmai.com":"gmail.com","gmail.fr":"gmail.com","hotmial.com":"hotmail.com","hotmail.con":"hotmail.com","hotmail.coom":"hotmail.com","hotnail.com":"hotmail.com","yaho.com":"yahoo.com","yahoo.con":"yahoo.com","yahoo.coom":"yahoo.com","yahho.com":"yahoo.com","outlok.com":"outlook.com","outlook.con":"outlook.com","outlook.coom":"outlook.com","icloud.con":"icloud.com","icloud.coom":"icloud.com","orange.ff":"orange.fr","orange.fe":"orange.fr","free.ff":"free.fr","wanadoo.ff":"wanadoo.fr","sfr.ff":"sfr.fr","laposte.ne":"laposte.net"};

const EMT={
fr:{fix:"Adresse e-mail corrigée : {e}. Vérifiez-la puis envoyez à nouveau.",bad:"Adresse e-mail invalide. Vérifiez-la.",pro:"Pour un prêt professionnel, saisissez une adresse e-mail professionnelle (pas Gmail, Yahoo, Hotmail, Outlook…)."},

de:{fix:"E-Mail-Adresse korrigiert: {e}. Bitte prüfen und erneut senden.",bad:"Ungültige E-Mail-Adresse. Bitte prüfen.",pro:"Für einen Geschäftskredit geben Sie bitte eine geschäftliche E-Mail-Adresse an (nicht Gmail, Yahoo, Hotmail, Outlook…)."},
it:{fix:"Indirizzo e-mail corretto: {e}. Controllalo e invia di nuovo.",bad:"Indirizzo e-mail non valido. Controllalo.",pro:"Per un prestito professionale inserisci un indirizzo e-mail aziendale (non Gmail, Yahoo, Hotmail, Outlook…)."},
es:{fix:"Correo corregido: {e}. Compruébelo y envíe de nuevo.",bad:"Correo electrónico no válido. Compruébelo.",pro:"Para un préstamo profesional, indique un correo profesional (no Gmail, Yahoo, Hotmail, Outlook…)."},
pt:{fix:"E-mail corrigido: {e}. Verifique e envie novamente.",bad:"E-mail inválido. Verifique-o.",pro:"Para um empréstimo profissional, indique um e-mail profissional (não Gmail, Yahoo, Hotmail, Outlook…)."},

ro:{fix:"Adresă de e-mail corectată: {e}. Verificați-o și trimiteți din nou.",bad:"Adresă de e-mail invalidă. Verificați-o.",pro:"Pentru un credit profesional, introduceți o adresă de e-mail profesională (nu Gmail, Yahoo, Hotmail, Outlook…)."},
hr:{fix:"E-adresa ispravljena: {e}. Provjerite je i pošaljite ponovno.",bad:"Neispravna e-adresa. Provjerite je.",pro:"Za profesionalni zajam unesite poslovnu e-adresu (ne Gmail, Yahoo, Hotmail, Outlook…)."},

};
function emFix(e){
  e=String(e||"").trim().toLowerCase().replace(/\s+/g,"").replace(/,/g,".");
  const i=e.lastIndexOf("@"); if(i<1) return e;
  let d=e.slice(i+1);
  if(EMFIX[d]) d=EMFIX[d]; else d=d.replace(/\.(coom|comm|con|cmo|vom|xom)$/,".com");
  return e.slice(0,i+1)+d;
}
function emCheck(fix){
  const el=$("email"), v=el.value.trim(), T2=EMT[lang]||EMT.en;
  el.setCustomValidity(""); if(!v) return "";
  const f=emFix(v);
  if(!/^[^\s@,;]+@([a-z0-9-]+\.)+[a-z]{2,}$/.test(f)||f.includes("..")){ el.setCustomValidity("x"); return T2.bad; }
  if(fix&&f!==v.toLowerCase()){ el.value=f; el.setCustomValidity("x"); return T2.fix.replace("{e}",f); }
  if(proLoan&&EMFREE.test(f.split("@")[1])){ el.setCustomValidity("x"); return T2.pro; }
  return "";
}
$("email").addEventListener("input",()=>$("email").setCustomValidity(""));
$("email").addEventListener("blur",()=>{ const m=emCheck(true); if(m){ $("msg").textContent=m; $("msg").className="msg err"; } });
$("cards").addEventListener("click",e=>{
  const a=e.target.closest&&e.target.closest("a.cta"); if(!a) return;
  e.preventDefault();
  $("form").scrollIntoView({behavior:"smooth",block:"start"});
  const i=[...$("cards").children].indexOf(a.closest(".card"));
  loanKind=(LOANIMG[i]&&LOANIMG[i][0])||""; proLoan=(loanKind==="professionnel");
  if($("email").value.trim()){ const m=emCheck(false); if(m){ $("msg").textContent=m; $("msg").className="msg err"; } }
});
function formClear(){ $("form").querySelectorAll(".is-err").forEach(x=>x.classList.remove("is-err")); }
["input","change"].forEach(ev=>$("form").addEventListener(ev,e=>{
  const el=e.target; if(!el||!el.classList) return;
  const t=el.type==="checkbox"?(el.closest(".consent")||el):el;
  if(t.classList.contains("is-err")&&el.checkValidity()&&!(el.id==="pays"&&!el.value)) t.classList.remove("is-err");
}));
$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg=$("msg"), btn=$("btn"), t=T[lang];
  msg.className="msg";
  formClear();
  const emM=emCheck(true);
  const bad=formErrors();
  if(bad.length){
    bad.forEach(el=>(el.type==="checkbox"?(el.closest(".consent")||el):el).classList.add("is-err"));
    msg.textContent=(emM&&bad.includes($("email")))?emM:t.invalid; msg.className="msg err";
    bad[0].scrollIntoView({behavior:"smooth",block:"center"});
    setTimeout(()=>{ try{ bad[0].focus({preventScroll:true}); }catch(e){} },350);
    return;
  }
  const ref=newRef();
  const dev=$("devise").value, dial=$("indicatif").selectedOptions[0].dataset.dial;
  const payload={
    "Montant demandé": money(loan().P,"fr-FR"),
    "Durée": loan().y+" ans ("+loan().n+" mois)",
    "Taux d’intérêt": "2 % par an",
    "Mensualité": money(loan().m,"fr-FR"),
    "Total à rembourser": money(loan().total,"fr-FR"),
    "Dont intérêts": money(loan().int,"fr-FR"),
    "Salaire mensuel": $("salaire").value+" "+dev,
    "Nom de famille": $("nom").value.trim(),
    "Prénom": $("prenom").value.trim(),
    "Pays": countryName($("pays").value),
    "Ville": cityValue(),
    "Travail": jobValue(),
    "Téléphone": "+"+dial+" "+$("tel").value.trim(),
    "Email": $("email").value.trim(),
    "Type de prêt": loanKind||"—",
    "Langue du visiteur": lang,
    "Référence": ref,
    "Consentement": "Oui",
    "_subject": "Nouvelle demande de crédit : "+$("prenom").value.trim()+" "+$("nom").value.trim(),
    "_template": "table",
    "_captcha": "false",
    "_honey": document.querySelector("[name=_honey]").value
  };
  const L0=loan(), rec={ref,email:payload["Email"].toLowerCase(),nom:payload["Nom de famille"],prenom:payload["Prénom"],pays:payload["Pays"],ville:payload["Ville"],tel:payload["Téléphone"],P:L0.P,y:L0.y,n:L0.n,m:L0.m,total:L0.total,int:L0.int,cur:dev};
  btn.disabled=true; btn.textContent=t.sending; let moving=false;
  try{
    if(await sendRequest(payload)){
      refCopy(msg,t.ok+" "+cu(13),ref); msg.className="msg ok";
      showContract(rec,false,"found"); regRec(rec); moving=true;
      msg.scrollIntoView({behavior:"smooth",block:"center"});
      setTimeout(()=>{ goPage(2); btn.disabled=false; btn.textContent=T[lang].btn; msg.className="msg"; msg.textContent=""; },6000);
      try{ window.OneSignalDeferred && OneSignalDeferred.push(o=>o.User.addTag("applied","true")); }catch(e){}
      $("form").reset(); $("pays").value="FR"; $("indicatif").value="FR"; updateLoan(); jobToggle(); updateCities(true);
    } else {
      outboxSet(outboxGet().concat([payload]));   /* copie gardée, renvoyée automatiquement plus tard */
      throw new Error("send failed");
    }
  }catch(err){
    msg.textContent=t.err; msg.className="msg err";
  }finally{
    if(!moving){ btn.disabled=false; btn.textContent=t.btn; }
  }
});
</script>

<script>
/* Animation du logo : les lettres KREDITAS se détachent une à une, forment une voiture + route,
   une maison, puis les services (voyage, travaux, études, professionnel), et reviennent en lettres. */
(function(){
"use strict";
var brand=document.querySelector(".brand"), logo=brand&&brand.querySelector(".logo");
if(!brand||!logo||!document.createElement("canvas").getContext)return;
if(window.matchMedia&&matchMedia("(prefers-reduced-motion:reduce)").matches)return;

/* ---- Réglages de vitesse (millisecondes) ---- */
var LETTER_STAGGER=90;      /* délai entre chaque lettre */
var MORPH=650;              /* durée du déplacement d'un point */
var DUR_LETTERS=2500;       /* durée de la scène « lettres » (avec pause d'1 s avant de recommencer) */
var DUR_CAR=2400;           /* voiture + route */
var DUR_SHAPE=1700;         /* maison et autres services */

var WORD="KREDITAS";
var LW=5;
var FONT='"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif';
var GOLD=[242,193,78], WHITE=[255,255,255], ROAD=[190,208,222];

var wrap=document.createElement("div"); wrap.className="kr-wrap";
var cv=document.createElement("canvas"); cv.className="kr-stage"; cv.setAttribute("aria-hidden","true");
var cap=document.createElement("div"); cap.className="kr-cap"; cap.setAttribute("aria-hidden","true");
wrap.appendChild(cv); wrap.appendChild(cap);
logo.insertAdjacentElement("afterend",wrap);
brand.classList.add("kr-on");

var ctx=cv.getContext("2d");
var off=document.createElement("canvas"), octx=off.getContext("2d",{willReadFrequently:true});
var W=0,H=0,dpr=1,K=1,R=1.7,N=0,P=[],scenes=[],cur=0,scStart=0,running=false,pausedAt=0,wantRun=true,built=false;
var lay={fs:40,xs:[],ws:[],ls:0};

/* ---- Formes (boîte locale 200 x 120) ---- */
function carDraw(c){c.lineWidth=LW;
  c.beginPath();c.moveTo(18,84);c.lineTo(18,64);c.quadraticCurveTo(18,54,30,52);c.lineTo(56,48);c.lineTo(74,28);
  c.quadraticCurveTo(78,24,86,24);c.lineTo(126,24);c.quadraticCurveTo(134,24,138,29);c.lineTo(152,48);c.lineTo(172,54);
  c.quadraticCurveTo(184,57,184,68);c.lineTo(184,84);c.closePath();c.stroke();
  c.beginPath();c.moveTo(66,48);c.lineTo(80,31);c.lineTo(104,31);c.lineTo(104,48);c.closePath();
  c.moveTo(112,31);c.lineTo(128,31);c.lineTo(142,48);c.lineTo(112,48);c.closePath();c.stroke();
  c.beginPath();c.arc(58,84,15,0,6.2832);c.stroke();c.beginPath();c.arc(146,84,15,0,6.2832);c.stroke();
  c.beginPath();c.arc(58,84,5,0,6.2832);c.fill();c.beginPath();c.arc(146,84,5,0,6.2832);c.fill();
  c.beginPath();c.arc(177,66,4,0,6.2832);c.fill();}
function roadDraw(c){c.lineWidth=LW*0.6;
  c.beginPath();c.moveTo(-400,104);c.lineTo(600,104);c.moveTo(-400,120);c.lineTo(600,120);c.stroke();
  c.beginPath();for(var x=-400;x<600;x+=36){c.moveTo(x,112);c.lineTo(x+18,112);}c.stroke();}
function houseDraw(c){c.lineWidth=LW;
  c.beginPath();c.moveTo(20,62);c.lineTo(100,10);c.lineTo(180,62);c.stroke();
  c.beginPath();c.moveTo(38,52);c.lineTo(38,112);c.lineTo(162,112);c.lineTo(162,52);c.stroke();
  c.strokeRect(88,76,24,36);c.strokeRect(52,72,22,20);c.strokeRect(126,72,22,20);
  c.beginPath();c.moveTo(138,34);c.lineTo(138,14);c.lineTo(154,14);c.lineTo(154,46);c.stroke();}
function planeDraw(c){c.lineWidth=LW;
  c.beginPath();c.moveTo(16,62);c.lineTo(184,14);c.lineTo(132,104);c.lineTo(100,70);c.closePath();c.stroke();
  c.beginPath();c.moveTo(100,70);c.lineTo(184,14);c.moveTo(100,70);c.lineTo(98,102);c.lineTo(120,86);c.stroke();}
function hammerDraw(c){c.save();c.translate(100,60);c.rotate(-Math.PI/4);c.lineWidth=LW;
  c.strokeRect(-36,-50,72,26);c.strokeRect(-7,-24,14,78);c.restore();}
function capDraw(c){c.lineWidth=LW;
  c.beginPath();c.moveTo(100,18);c.lineTo(184,52);c.lineTo(100,86);c.lineTo(16,52);c.closePath();c.stroke();
  c.beginPath();c.moveTo(50,70);c.lineTo(50,94);c.quadraticCurveTo(100,118,150,94);c.lineTo(150,70);c.stroke();
  c.beginPath();c.moveTo(172,58);c.lineTo(172,96);c.stroke();c.beginPath();c.arc(172,102,6,0,6.2832);c.fill();}
function caseDraw(c){c.lineWidth=LW;
  c.strokeRect(24,42,152,64);
  c.beginPath();c.moveTo(76,42);c.lineTo(76,26);c.lineTo(124,26);c.lineTo(124,42);c.moveTo(24,72);c.lineTo(176,72);c.stroke();
  c.fillRect(90,66,20,14);}
function textDraw(c){c.font="800 "+lay.fs+"px "+FONT;c.textBaseline="middle";c.textAlign="left";
  for(var i=0;i<WORD.length;i++)c.fillText(WORD.charAt(i),lay.xs[i],H/2+lay.fs*0.04);}

function carSpokes(c,el){c.lineWidth=2.4;var a=el*0.014;
  [58,146].forEach(function(x){for(var i=0;i<3;i++){var b=a+i*Math.PI/3;c.beginPath();c.moveTo(x-11*Math.cos(b),84-11*Math.sin(b));c.lineTo(x+11*Math.cos(b),84+11*Math.sin(b));c.stroke();}});}
function carMove(el,dur){return[(el/dur-0.5)*W*0.34,Math.sin(el*0.025)*1.2];}

function layoutText(){
  var base=100;octx.font="800 "+base+"px "+FONT;
  var ws=[],sum=0,i;for(i=0;i<WORD.length;i++){var w=octx.measureText(WORD.charAt(i)).width;ws.push(w);sum+=w;}
  var lsB=base*0.1,totB=sum+lsB*(WORD.length-1);
  var s=(W*0.94)/totB;if(base*s>H*0.8)s=H*0.8/base;
  lay.fs=base*s;lay.ls=lsB*s;lay.ws=ws.map(function(w){return w*s;});
  var tot=0;for(i=0;i<ws.length;i++)tot+=lay.ws[i];tot+=lay.ls*(WORD.length-1);
  var x=(W-tot)/2;lay.xs=[];for(i=0;i<ws.length;i++){lay.xs.push(x);x+=lay.ws[i]+lay.ls;}
}

function sample(draw,color,step,box,grp){
  octx.clearRect(0,0,W,H);
  octx.fillStyle=octx.strokeStyle="rgb("+color[0]+","+color[1]+","+color[2]+")";
  octx.lineCap=octx.lineJoin="round";
  octx.save();
  if(box){var k=Math.min(W*0.8/box[0],H*0.86/box[1]);K=k;var tx=W/2-box[0]*k/2,ty=H/2-box[1]*k/2;if(grp){grp.k=k;grp.tx=tx;grp.ty=ty;}octx.translate(tx,ty);octx.scale(k,k);}
  draw(octx);octx.restore();
  var d=octx.getImageData(0,0,W,H).data,pts=[];
  for(var y=0;y<H;y+=step)for(var x=0;x<W;x+=step){
    if(d[(y*W+x)*4+3]>140)pts.push({x:x+(Math.random()-.5)*step*.6,y:y+(Math.random()-.5)*step*.6});}
  return pts;
}

function build(){
  W=Math.max(200,Math.round(wrap.clientWidth));H=Math.round(Math.min(240,Math.max(150,W*0.5)));
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;cv.style.height=H+"px";off.width=W;off.height=H;
  R=Math.max(1.2,Math.min(1.9,W/230));
  layoutText();
  var defs=[
    {dur:DUR_LETTERS,settle:1650,letters:true,cap:-1,groups:[{draw:textDraw,color:WHITE,step:3,letters:true}]},
    {dur:DUR_CAR,settle:1350,cap:6,groups:[{draw:carDraw,color:GOLD,step:3,box:[200,120],move:carMove,extra:carSpokes},{draw:roadDraw,color:ROAD,step:4,box:[200,120]}]},
    {dur:DUR_SHAPE,settle:1250,cap:4,groups:[{draw:houseDraw,color:GOLD,step:3,box:[200,120]}]},
    {dur:DUR_SHAPE,settle:1250,cap:2,groups:[{draw:planeDraw,color:GOLD,step:3,box:[200,120]}]},
    {dur:DUR_SHAPE,settle:1250,cap:8,groups:[{draw:hammerDraw,color:GOLD,step:3,box:[200,120]}]},
    {dur:DUR_SHAPE,settle:1250,cap:10,groups:[{draw:capDraw,color:GOLD,step:3,box:[200,120]}]},
    {dur:DUR_SHAPE,settle:1250,cap:12,groups:[{draw:caseDraw,color:GOLD,step:3,box:[200,120]}]}
  ];
  var max=0;
  defs.forEach(function(s){
    s.pts=[];
    s.groups.forEach(function(g,gi){
      sample(g.draw,g.color,g.step,g.box,g).forEach(function(p){
        p.g=gi;p.col=g.color;
        if(g.letters){var li=0;for(var i=0;i<WORD.length;i++){if(p.x>=lay.xs[i]-lay.ls/2)li=i;}p.l=li;}
        s.pts.push(p);});
    });
    if(s.pts.length>max)max=s.pts.length;
  });
  N=Math.min(1100,max);
  defs.forEach(function(s){
    var a=s.pts.slice(),i,j,t;
    for(i=a.length-1;i>0;i--){j=(Math.random()*(i+1))|0;t=a[i];a[i]=a[j];a[j]=t;}
    s.t=[];s.dl=[];s.dr=[];
    for(i=0;i<N;i++){
      var p=a[i%a.length];s.t.push(p);
      var delay=(p.l!==undefined)?p.l*LETTER_STAGGER+Math.random()*60:(p.x/W)*300+Math.random()*90;
      s.dl.push(delay);s.dr.push(MORPH+Math.random()*220);
    }
  });
  scenes=defs;
  P=[];
  for(var i=0;i<N;i++){var x=Math.random()*W,y=Math.random()*H;
    P.push({x:x,y:y,sx:x,sy:y,c:[255,255,255],ph:Math.random()*6.28,arc:(Math.random()-.5)*50});}
  built=true;
}

function capText(idx){
  if(idx<0)return"";
  try{var a=(LOANS[lang]||LOANS.en).split("|");return a[idx]||"";}catch(e){return"";}
}
function startScene(i,now){
  cur=i;scStart=now;
  for(var k=0;k<P.length;k++){P[k].sx=P[k].x;P[k].sy=P[k].y;}
  var txt=capText(scenes[i].cap);
  cap.style.opacity=0;
  setTimeout(function(){cap.textContent=txt;cap.style.opacity=1;},180);
}
function crispAlpha(S,el){
  var a=Math.min(1,Math.max(0,(el-S.settle)/260));
  return a*(1-Math.min(1,Math.max(0,(el-(S.dur-320))/320)));
}
function crisp(S,el,a){
  if(a<=0)return;
  ctx.save();ctx.globalAlpha=a;ctx.lineCap=ctx.lineJoin="round";
  if(S.letters){
    var gr=ctx.createLinearGradient(0,H*0.25,0,H*0.75);gr.addColorStop(0,"#ffffff");gr.addColorStop(1,"#ffe9a8");
    ctx.fillStyle=gr;ctx.shadowColor="rgba(242,193,78,.6)";ctx.shadowBlur=16;
    ctx.font="800 "+lay.fs+"px "+FONT;ctx.textBaseline="middle";ctx.textAlign="left";
    for(var i=0;i<WORD.length;i++)ctx.fillText(WORD.charAt(i),lay.xs[i],H/2+lay.fs*0.04);
  }else{
    S.groups.forEach(function(g){
      var o=g.move?g.move(el,S.dur):[0,0];
      ctx.save();ctx.translate(g.tx+o[0],g.ty+o[1]);ctx.scale(g.k,g.k);
      var col="rgb("+g.color[0]+","+g.color[1]+","+g.color[2]+")";
      ctx.strokeStyle=ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10;
      LW=3.4;g.draw(ctx);LW=5;
      if(g.extra)g.extra(ctx,el);
      ctx.restore();});
  }
  ctx.restore();
}
function draw(S,el,now){
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  var T=S.t,DL=S.dl,DR=S.dr,ca=crispAlpha(S,el);ctx.globalAlpha=1-0.7*ca;
  for(var i=0;i<N;i++){
    var p=P[i],t=T[i],g=S.groups[t.g],ox=0,oy=0;
    if(g.move){var m=g.move(el,S.dur);ox=m[0];oy=m[1];}
    var tx=t.x+ox,ty=t.y+oy;
    var u=(el-DL[i])/DR[i];u=u<0?0:(u>1?1:u);
    var e=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    var x=p.sx+(tx-p.sx)*e,y=p.sy+(ty-p.sy)*e+Math.sin(u*Math.PI)*p.arc;
    if(u>=1){x+=Math.sin(now*0.004+p.ph)*0.6;y+=Math.cos(now*0.0037+p.ph)*0.6;}
    p.x=x;p.y=y;
    var c=p.c,cc=t.col;c[0]+=(cc[0]-c[0])*.12;c[1]+=(cc[1]-c[1])*.12;c[2]+=(cc[2]-c[2])*.12;
    ctx.fillStyle="rgb("+(c[0]|0)+","+(c[1]|0)+","+(c[2]|0)+")";
    ctx.beginPath();ctx.arc(x,y,R,0,6.2832);ctx.fill();
  }
  ctx.globalAlpha=1;crisp(S,el,ca);
}
function tick(now){
  if(!running)return;
  var S=scenes[cur],el=now-scStart;
  if(el>=S.dur){startScene((cur+1)%scenes.length,now);S=scenes[cur];el=0;}
  draw(S,el,now);
  requestAnimationFrame(tick);
}
function run(){
  if(running||!built||!wantRun||document.hidden)return;
  running=true;
  requestAnimationFrame(function(n){
    if(pausedAt){scStart+=n-pausedAt;pausedAt=0;}else{startScene(cur,n);}
    tick(n);
  });
}
function stop(){if(!running)return;running=false;pausedAt=performance.now();}

function init(){
  build();
  run();
  if("IntersectionObserver" in window){
    new IntersectionObserver(function(en){wantRun=en[0].isIntersecting;wantRun?run():stop();}).observe(wrap);
  }
  document.addEventListener("visibilitychange",function(){document.hidden?stop():run();});
  var lastW=W,tm;
  window.addEventListener("resize",function(){
    clearTimeout(tm);tm=setTimeout(function(){
      var nw=Math.round(wrap.clientWidth);if(Math.abs(nw-lastW)<20)return;
      lastW=nw;var was=running;running=false;pausedAt=0;cur=0;build();if(was||wantRun)run();
    },250);
  });
}
var ready=(document.fonts&&document.fonts.load)?document.fonts.load("800 60px Manrope",WORD):Promise.resolve();
Promise.race([ready,new Promise(function(r){setTimeout(r,1500);})]).catch(function(){}).then(init);
})();
</script>
