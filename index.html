<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Demande de crédit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F5; --card:#FFFFFF; --ink:#12202B; --muted:#5B6B77;
  --line:#C9D4DB; --accent:#0F5C5A; --accent-ink:#FFFFFF; --err:#B3261E; --ok:#1B6B3A;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#0E1A21; --card:#16262F; --ink:#E8EFF3; --muted:#9FB1BC;
    --line:#2C424E; --accent:#3FB5AE; --accent-ink:#06201F; --err:#FF8A80; --ok:#7FDCA0; }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  line-height:1.5;min-height:100vh}
.top{display:flex;justify-content:flex-end;align-items:center;gap:.6rem;
  padding:.8rem 1rem;background:var(--card);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:5}
.top label{font-size:.85rem;color:var(--muted)}
.top select{font:inherit;font-size:.95rem;padding:.45rem .6rem;border:1px solid var(--line);
  border-radius:8px;background:var(--bg);color:var(--ink)}
main{max-width:640px;margin:0 auto;padding:1.6rem 1rem 3rem}
h1{font-size:clamp(1.7rem,6vw,2.3rem);font-weight:800;letter-spacing:-.02em;margin:.4rem 0 .4rem}
.lead{color:var(--muted);margin:0 0 1.6rem}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.3rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.full{grid-column:1/-1}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.field label{display:block;font-weight:600;font-size:.92rem;margin-bottom:.3rem}
input,select{width:100%;font:inherit;font-size:1rem;color:var(--ink);background:var(--bg);
  border:1px solid var(--line);border-radius:9px;padding:.7rem .75rem;min-height:46px}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.phone{display:flex;gap:.5rem}
.phone select{flex:0 0 138px;width:138px}
.phone input{flex:1;min-width:0}
.amt{display:flex;gap:.5rem}
.amt input{flex:1;min-width:0}
.amt select,.amt .cur{flex:0 0 96px;width:96px}
.amt .cur{display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--muted);font-weight:600}
.hp{position:absolute;left:-9999px;opacity:0;height:0;width:0}
button{width:100%;margin-top:1.3rem;font:inherit;font-weight:700;font-size:1.05rem;
  background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;
  padding:.9rem 1rem;min-height:50px;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.msg{display:none;margin-top:1rem;padding:.8rem 1rem;border-radius:9px;font-weight:600}
.msg.ok{display:block;background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.msg.err{display:block;background:color-mix(in srgb,var(--err) 14%,transparent);color:var(--err)}
.note{font-size:.82rem;color:var(--muted);margin-top:1rem}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(rgba(6,32,34,.55),rgba(6,32,34,.78)),
    url("fond.jpg") center/cover no-repeat,
    url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 800 1200' preserveAspectRatio='xMidYMid slice'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%230F5C5A'/><stop offset='1' stop-color='%23091F24'/></linearGradient></defs><rect width='800' height='1200' fill='url(%23g)'/><g fill='%23ffffff' fill-opacity='.07'><rect x='60' y='820' width='90' height='300'/><rect x='190' y='720' width='90' height='400'/><rect x='320' y='610' width='90' height='510'/><rect x='450' y='490' width='90' height='630'/><rect x='580' y='360' width='90' height='760'/></g><g fill='none' stroke='%23F2C14E' stroke-opacity='.35' stroke-width='6'><circle cx='640' cy='170' r='70'/><circle cx='640' cy='170' r='48'/><circle cx='520' cy='250' r='56'/><circle cx='520' cy='250' r='36'/><circle cx='150' cy='330' r='80'/><circle cx='150' cy='330' r='56'/></g><path d='M40 1000 L200 880 L330 930 L470 720 L620 650 L760 480' fill='none' stroke='%23F2C14E' stroke-opacity='.55' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/></svg>") center/cover no-repeat,#0B2E30}
h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
input[type=range]{padding:0;min-height:34px;border:0;background:transparent;accent-color:var(--accent);margin-top:.5rem}
.rate{margin:.2rem 0 .8rem;font-size:.9rem;color:var(--muted)}
.result{border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem;background:var(--bg)}
.result .big,.result .row{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
.result .big{font-weight:600;padding-bottom:.6rem;margin-bottom:.5rem;border-bottom:1px solid var(--line)}
.result .big strong{font-size:1.7rem;font-weight:800;color:var(--accent)}
.result .row{font-size:.95rem;padding:.15rem 0}
[dir="rtl"] .top{justify-content:flex-start}

/* ===== Entête KREDITAS ===== */
.brand{margin:0 0 1.4rem;overflow:hidden}
.logo{margin:0;font-weight:800;font-size:clamp(2rem,9vw,3rem);letter-spacing:.16em;color:#fff;
  text-shadow:0 2px 14px rgba(0,0,0,.45);line-height:1.1}
.logo::after{content:"";display:block;width:64px;height:4px;border-radius:2px;background:#F2C14E;margin-top:.5rem}
.marquee{overflow:hidden;white-space:nowrap;width:100vw;margin:.9rem 0 0 calc(50% - 50vw);
  padding:.55rem 0;background:rgba(0,0,0,.28)}
.tagline{display:inline-block;margin:0;color:#fff;font-weight:600;font-size:clamp(1rem,3.8vw,1.15rem);
  text-shadow:0 2px 10px rgba(0,0,0,.5);will-change:transform;
  animation:marqueeLR 26s linear infinite}
@keyframes marqueeLR{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
@media (prefers-reduced-motion:reduce){.marquee{white-space:normal;padding:.55rem 1rem;width:auto;margin-left:0}
  .tagline{animation:none}}
html{overflow-x:hidden}
.flag{font-size:1.6rem;line-height:1}

/* ===== Types de prêt ===== */
html{scroll-behavior:smooth}
#form{scroll-margin-top:4.5rem}
.loans{margin:1.6rem 0 2rem}
.loans h2{color:#fff;font-size:clamp(1.3rem,5vw,1.7rem);font-weight:800;margin:0 0 1rem;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:520px){.cards{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{height:180px;background-size:cover;background-position:center;position:relative}
.ph span{position:absolute;left:.7rem;top:.7rem;font-size:1.3rem;background:rgba(0,0,0,.35);border-radius:999px;width:2.4rem;height:2.4rem;display:grid;place-items:center}
.cb{padding:1rem;display:flex;flex-direction:column;flex:1}
.card h3{margin:0 0 .3rem;font-size:1.1rem;font-weight:800}
.card p{margin:0 0 .6rem;color:var(--muted);font-size:.92rem}
.card ul{margin:0 0 .9rem;padding-left:1.1rem;font-size:.85rem}
.cta{margin-top:auto;display:block;text-align:center;text-decoration:none;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:.7rem}

/* ===== Pied de page ===== */
.foot{margin-top:1rem;padding:1.4rem 1rem 2rem;background:rgba(0,0,0,.38);color:#fff;font-size:.92rem}
.foot .in{max-width:640px;margin:0 auto}
.foot strong{display:block;font-size:1.15rem;letter-spacing:.14em;margin-bottom:.6rem}
.foot dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:.3rem 1rem}
.foot dt{opacity:.75}.foot dd{margin:0}
.foot a{color:#F2C14E}

/* ===== Chat ===== */
.foot{padding-bottom:5.5rem}
button.chatbtn{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));z-index:20;width:auto;margin:0;
  display:flex;align-items:center;gap:.5rem;padding:.8rem 1.1rem;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.4);
  animation:shake 5s ease-in-out infinite;transform-origin:50% 100%}
button.chatbtn.open{animation:none}
@keyframes shake{0%,80%,100%{transform:none}82%{transform:rotate(-9deg)}84%{transform:rotate(9deg)}86%{transform:rotate(-7deg)}88%{transform:rotate(7deg)}90%{transform:rotate(-3deg)}92%{transform:none}}
@media (prefers-reduced-motion:reduce){button.chatbtn{animation:none}}
.chat{position:fixed;right:1rem;bottom:calc(5.4rem + env(safe-area-inset-bottom,0px));z-index:21;width:min(360px,calc(100vw - 2rem));
  max-height:72vh;display:none;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 12px 36px rgba(0,0,0,.45);overflow:hidden}
.chat.open{display:flex}
.chat header{display:flex;justify-content:space-between;align-items:center;padding:.7rem 1rem;background:var(--accent);color:var(--accent-ink);font-weight:800;letter-spacing:.12em}
.chat header button{width:auto;margin:0;min-height:0;padding:.1rem .6rem;background:transparent;color:inherit;font-size:1.4rem;line-height:1}
.chatlog{flex:1;overflow-y:auto;padding:.7rem 1rem;min-height:90px}
.b{max-width:85%;padding:.55rem .8rem;border-radius:12px;font-size:.92rem;margin:.3rem 0;overflow-wrap:anywhere}
.b.me{margin-left:auto;background:var(--accent);color:var(--accent-ink)}
.b.them{background:var(--bg);border:1px solid var(--line)}
.chat form{border:0;border-top:1px solid var(--line);border-radius:0;padding:.7rem;display:grid;gap:.5rem}
.chat form input,.chat form textarea{font:inherit;font-size:.95rem;min-height:40px;padding:.5rem .65rem;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:9px;width:100%}
.chat form textarea{resize:none}
.chat form button{margin:0;min-height:44px;font-size:1rem}

/* ===== Drapeaux UE ===== */
.eu{overflow:hidden;margin-top:1.4rem;padding:.9rem 0;background:rgba(0,0,0,.28)}
.eu-track{display:flex;width:max-content;animation:euLeft 80s linear infinite}
.eu-track span{font-size:2.3rem;line-height:1;margin:0 .9rem}
@keyframes euLeft{from{transform:translateX(0)}to{transform:translateX(-16.6667%)}}
@media (prefers-reduced-motion:reduce){.eu-track{animation:none;flex-wrap:wrap;width:auto;justify-content:center}.eu-track span:nth-child(n+29){display:none}}
</style>
</head>
<body>
<div class="top">
  <label for="lang" id="langLabel">Langue</label>
  <span class="flag" id="langFlag" aria-hidden="true">🇫🇷</span>
  <select id="lang" aria-label="Language">
    <option value="fr">🇫🇷 Français</option>
    <option value="en">🇬🇧 English</option>
    <option value="lt">🇱🇹 Lietuvių</option>
    <option value="lb">🇱🇺 Lëtzebuergesch</option>
    <option value="lv">🇱🇻 Latviešu</option>
    <option value="it">🇮🇹 Italiano</option>
    <option value="de">🇩🇪 Deutsch</option>
    <option value="pt">🇵🇹 Português</option>
    <option value="ru">🇷🇺 Русский</option>
    <option value="uk">🇺🇦 Українська</option>
    <option value="ro">🇷🇴 Română</option>
    <option value="hr">🇭🇷 Hrvatski</option>
  </select>
</div>
<main>
  <header class="brand">
    <div class="logo">KREDITAS</div>
    <div class="marquee" aria-live="off"><p class="tagline" id="tagline"></p></div>
  </header>
  <section class="loans" aria-labelledby="loansTitle">
    <h2 id="loansTitle"></h2>
    <div class="cards" id="cards"></div>
  </section>
  <h1 id="title"></h1>
  <form id="form" novalidate>
    <div class="grid">
      <div class="field full">
        <label for="montant" id="l_montant"></label>
        <div class="amt">
          <input id="montant" type="number" inputmode="decimal" min="1000" max="800000" step="any" value="5000" required>
          <select id="devise" aria-label="Currency"><option>EUR</option><option>GBP</option><option>CHF</option><option>SEK</option><option>NOK</option><option>DKK</option><option>PLN</option><option>CZK</option><option>HUF</option><option>RON</option><option>BGN</option><option>ISK</option><option>RSD</option><option>UAH</option><option>TRY</option><option>MDL</option><option>ALL</option><option>MKD</option><option>BAM</option><option>GEL</option></select>
        </div>
        <input id="montantRange" type="range" min="1000" max="800000" step="1000" value="5000" aria-label="Amount">
      </div>
      <div class="field full">
        <label for="duree"><span id="l_duree"></span> : <b id="dureeOut"></b></label>
        <input id="duree" type="range" min="1" max="35" step="1" value="2">
        <p class="rate" id="taux"></p>
        <div class="result" aria-live="polite">
          <div class="big"><span id="l_mensu"></span><strong id="o_mensu"></strong></div>
          <div class="row"><span id="l_total"></span><strong id="o_total"></strong></div>
          <div class="row"><span id="l_interets"></span><strong id="o_int"></strong></div>
        </div>
      </div>
      <div class="field full">
        <label for="salaire" id="l_salaire"></label>
        <div class="amt">
          <input id="salaire" type="number" inputmode="decimal" min="0" step="any" required>
          <div class="cur" id="cur2">EUR</div>
        </div>
      </div>
      <div class="field"><label for="nom" id="l_nom"></label>
        <input id="nom" type="text" autocomplete="family-name" required></div>
      <div class="field"><label for="prenom" id="l_prenom"></label>
        <input id="prenom" type="text" autocomplete="given-name" required></div>
      <div class="field"><label for="pays" id="l_pays"></label>
        <select id="pays" required></select></div>
      <div class="field"><label for="ville" id="l_ville"></label>
        <input id="ville" type="text" autocomplete="address-level2" required></div>
      <div class="field full"><label for="job" id="l_job"></label>
        <input id="job" type="text" autocomplete="organization-title" required></div>
      <div class="field full">
        <label for="tel" id="l_tel"></label>
        <div class="phone">
          <select id="indicatif" aria-label="Country code"></select>
          <input id="tel" type="tel" inputmode="tel" autocomplete="tel-national" required>
        </div>
      </div>
      <div class="field full"><label for="email" id="l_email"></label>
        <input id="email" type="email" autocomplete="email" required></div>
    </div>
    <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit" id="btn"></button>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
  </form>
</main>
<div class="eu" aria-hidden="true"><div class="eu-track" id="euTrack"></div></div>
<footer class="foot"><div class="in"><strong>KREDITAS</strong>
  <dl>
    <dt id="f_addr"></dt><dd>Ulonų g. 5, LT-08240 Vilnius</dd>
    <dt id="f_code"></dt><dd>304238386</dd>
    <dt id="f_mail"></dt><dd><a href="mailto:contact@kreditas.online">contact@kreditas.online</a></dd>
    <dt id="f_dir"></dt><dd>Elena Skersene, direktorė</dd>
    <dt id="f_date"></dt><dd id="f_dateV"></dd>
  </dl></div></footer>
<button type="button" class="chatbtn" id="chatBtn" aria-controls="chat" aria-expanded="false"></button>
<div class="chat" id="chat" role="dialog" aria-label="Chat">
  <header><span>KREDITAS</span><button type="button" id="chatClose" aria-label="Close">×</button></header>
  <div class="chatlog" id="chatLog" aria-live="polite"><div class="b them" id="greet"></div></div>
  <form id="chatForm" novalidate>
    <input id="c_name" type="text" autocomplete="given-name">
    <input id="c_email" type="email" autocomplete="email">
    <textarea id="c_msg" rows="3"></textarea>
    <button type="submit" id="c_send"></button>
  </form>
</div>

$("chatForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const n=$("c_name").value.trim(), m=$("c_email").value.trim(), msg=$("c_msg").value.trim(), t=T[lang], b=$("c_send"), lab=b.textContent;
  if(!n || !/^\S+@\S+\.\S+$/.test(m) || !msg){ bubble(t.invalid,"them"); return; }
  bubble(msg,"me"); $("c_msg").value=""; b.disabled=true;
  try{
    const r=await fetch("https://formsubmit.co/ajax/"+DESTINATION_EMAIL,{method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify({"Nom":n,"email":m,"Message":msg,"Langue du visiteur":lang,"_subject":"Nouveau message du chat KREDITAS : "+n,"_template":"table","_captcha":"false"})});
    const d=await r.json();
    if(r.ok && (d.success===true||d.success==="true")) bubble(t.ok,"them"); else throw 0;
  }catch(err){ bubble(t.err,"them"); }
  finally{ b.disabled=false; }
});

function renderLoans(){

  $("loansTitle").textContent=a[0];

    `<article class="card"><div class="ph" role="img" aria-label="${a[2+i*2]}" style="background-image:${x[2]};background-position:${x[3]}"></div>`+
    `<div class="cb"><h3>${a[2+i*2]}</h3><p>${a[3+i*2]}</p>`+

    `<a class="cta" href="#form">${a[1]}</a></div></article>`).join("");
}

const flag = iso => String.fromCodePoint(...[...iso].map(ch=>127397+ch.charCodeAt(0)));
function $(id){ return document.getElementById(id); }
let lang = "fr";

function countryName(iso){
  try{ return new Intl.DisplayNames([lang],{type:"region"}).of(iso) || iso; }
  catch(e){ return iso; }
}
function buildLists(){
  const p = $("pays").value || "FR", d = $("indicatif").value || "FR";
  const sorted = COUNTRIES.map(c=>({...c,name:countryName(c.iso)}))
    .sort((a,b)=>a.name.localeCompare(b.name,lang));
  $("pays").innerHTML = `<option value="" disabled>${T[lang].choose}</option>` +
    sorted.map(c=>`<option value="${c.iso}">${flag(c.iso)} ${c.name}</option>`).join("");
  $("indicatif").innerHTML = sorted.map(c=>
    `<option value="${c.iso}" data-dial="${c.dial}">${flag(c.iso)} +${c.dial} ${c.name}</option>`).join("");
  $("pays").value = p; $("indicatif").value = d;
}

const RATE = 0.02;   /* 2 % par an, pour toutes les demandes */
function loan(){
  const v = Math.min(800000, Math.max(1000, +$("montant").value || 0));
  const y = +$("duree").value, n = y*12, r = RATE/12;
  const m = v*r/(1-Math.pow(1+r,-n)), total = m*n;
  return {P:v, y, n, m, total, int: total-v};
}
function money(v,loc){
  try{ return new Intl.NumberFormat(loc,{style:"currency",currency:$("devise").value}).format(v); }
  catch(e){ return v.toFixed(2)+" "+$("devise").value; }
}
function updateLoan(){
  const L = loan(), t = T[lang];
  $("dureeOut").textContent = L.y+" "+t.mois;
  $("o_mensu").textContent = money(L.m,lang);
  $("o_total").textContent = money(L.total,lang);
  $("o_int").textContent = money(L.int,lang);
  $("cur2").textContent = $("devise").value;
}
$("montant").addEventListener("input",()=>{ $("montantRange").value = $("montant").value; updateLoan(); });
$("montant").addEventListener("change",()=>{ const v=Math.min(800000,Math.max(1000,+$("montant").value||1000)); $("montant").value=v; $("montantRange").value=v; updateLoan(); });
$("montantRange").addEventListener("input",()=>{ $("montant").value = $("montantRange").value; updateLoan(); });
$("duree").addEventListener("input",updateLoan);
$("devise").addEventListener("change",()=>{updateLoan();renderLoans();});
$("lang").addEventListener("change",e=>{ applyLang(e.target.value); try{ localStorage.setItem("lang",e.target.value); }catch(err){} });

(function init(){
  let l = null;
  try{ l = localStorage.getItem("lang"); }catch(e){}      /* choix manuel du visiteur, s'il y en a un */
  if(!l || !T[l]){
    l = null;
    const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language||"fr"];
    for(const x of list){ const c = String(x).slice(0,2).toLowerCase(); if(T[c]){ l = c; break; } }
    if(!l) l = "fr";                                          /* langue non prise en charge : français */
  }
  $("lang").value = l;
  applyLang(l);
  $("pays").value = "FR"; $("indicatif").value = "FR";
})();

$("form").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg=$("msg"), btn=$("btn"), t=T[lang];
  msg.className="msg";
  if(!$("form").checkValidity() || !$("pays").value){
    msg.textContent=t.invalid; msg.className="msg err"; $("form").reportValidity(); return;
  }
  const dev=$("devise").value, dial=$("indicatif").selectedOptions[0].dataset.dial;
  const payload={
    "Montant demandé": money(loan().P,"fr-FR"),
    "Durée": loan().y+" ans ("+loan().n+" mois)",
    "Taux d’intérêt": "2 % par an",
    "Mensualité": money(loan().m,"fr-FR"),
    "Total à rembourser": money(loan().total,"fr-FR"),
    "Dont intérêts": money(loan().int,"fr-FR"),
    "Salaire mensuel": $("salaire").value+" "+dev,
    "Nom de famille": $("nom").value.trim(),
    "Prénom": $("prenom").value.trim(),
    "Pays": countryName($("pays").value),
    "Ville": $("ville").value.trim(),
    "Travail": $("job").value.trim(),
    "Téléphone": "+"+dial+" "+$("tel").value.trim(),
    "Email": $("email").value.trim(),
    "Langue du visiteur": lang,
    "_subject": "Nouvelle demande de crédit : "+$("prenom").value.trim()+" "+$("nom").value.trim(),
    "_template": "table",
    "_captcha": "false",
    "_honey": document.querySelector("[name=_honey]").value
  };
  btn.disabled=true; btn.textContent=t.sending;
  try{
    const r=await fetch("https://formsubmit.co/ajax/"+DESTINATION_EMAIL,{
      method:"POST",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body:JSON.stringify(payload)
    });
    const data=await r.json();
    if(r.ok && (data.success===true||data.success==="true")){
      msg.textContent=t.ok; msg.className="msg ok";
      try{ window.OneSignalDeferred && OneSignalDeferred.push(o=>o.User.addTag("applied","true")); }catch(e){}
      $("form").reset(); $("pays").value="FR"; $("indicatif").value="FR"; updateLoan();
    } else throw new Error(data.message||"error");
  }catch(err){
    msg.textContent=t.err; msg.className="msg err";
  }finally{
    btn.disabled=false; btn.textContent=t.btn;
  }
});
</script>
</body>
</html>
